name: Verify MAPID Explorer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: dart run melos run generate --no-select
      - name: Verify committed generated sources
        run: git diff --exit-code
      - run: dart run melos run check --no-select
  android:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: ./.github/actions/setup-flutter
      - name: Configure compile-only test values
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          Path('.env').write_text('MAPID_API_KEY=ci-placeholder\nMAPID_LAYER_ID=ci-layer\nMAPID_PROJECT_ID=ci-project\n')
          PYTHON
      - name: Verify Android compilation
        run: dart run tool/app.dart build android dev --smoke
