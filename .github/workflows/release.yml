name: Release MAPID Explorer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag matching pubspec.yaml, for example v1.0.0'
        required: true
        type: string
      publish:
        description: Publish the release after all artifacts are uploaded
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          match = re.fullmatch(r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*))?', tag)
          if not match:
              raise SystemExit('Use a version tag such as v1.0.0 or v1.0.0-rc.1.')
          version = '.'.join(match.group(1, 2, 3))
          pubspec = Path('apps/fluent_starter/pubspec.yaml').read_text()
          declared = re.search(r'^version:\s*(\d+\.\d+\.\d+)(?:\+\d+)?\s*$', pubspec, re.MULTILINE)
          if not declared or declared.group(1) != version:
              raise SystemExit('The release version must match apps/fluent_starter/pubspec.yaml.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\nversion={version}\nprerelease={str(match.group(4) is not None).lower()}\n')
          PYTHON
      - uses: ./.github/actions/setup-flutter
      - run: dart run melos run generate --no-select
      - name: Verify committed generated sources
        run: git diff --exit-code
      - run: dart run melos run check --no-select

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: ios
            runner: macos-26
          - platform: web
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      RELEASE_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: ./.github/actions/setup-flutter
      - name: Configure MAPID
        env:
          MAPID_ENV: ${{ secrets.MAPID_ENV }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          content = os.environ['MAPID_ENV']
          values = {}
          for line in content.splitlines():
              if '=' in line and not line.lstrip().startswith('#'):
                  key, value = line.split('=', 1)
                  values[key.strip()] = value.strip().strip('"\'')
          required = ('MAPID_API_KEY', 'MAPID_LAYER_ID', 'MAPID_PROJECT_ID')
          if any(not values.get(key) for key in required):
              raise SystemExit('MAPID_ENV must contain the three populated MAPID settings.')
          path = Path('.env')
          path.write_text(content)
          path.chmod(0o600)
          Path('dist').mkdir(exist_ok=True)
          PYTHON
      - name: Configure persistent Android signing
        if: matrix.platform == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PYTHON'
          import base64, os
          from pathlib import Path
          names = ('ANDROID_KEYSTORE_BASE64', 'ANDROID_STORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD')
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('All four Android signing secrets are required for a release.')
          keystore = Path(os.environ['RUNNER_TEMP']) / 'mapid-release.jks'
          keystore.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          keystore.chmod(0o600)
          values = {
              'storeFile': str(keystore),
              'storePassword': os.environ['ANDROID_STORE_PASSWORD'],
              'keyAlias': os.environ['ANDROID_KEY_ALIAS'],
              'keyPassword': os.environ['ANDROID_KEY_PASSWORD'],
          }
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace('\t', '\\t').replace(' ', '\\ ')
          properties = Path('apps/fluent_starter/android/key.properties')
          properties.write_text(''.join(f'{key}={escape(value)}\n' for key, value in values.items()))
          properties.chmod(0o600)
          PYTHON
      - name: Build Android APK and app bundle
        if: matrix.platform == 'android'
        working-directory: apps/fluent_starter
        run: |
          flutter build apk --release --flavor prod --build-name "$RELEASE_VERSION" --build-number "$RELEASE_BUILD_NUMBER" --dart-define-from-file "$GITHUB_WORKSPACE/.env" --dart-define FLAVOR=prod
          flutter build appbundle --release --flavor prod --build-name "$RELEASE_VERSION" --build-number "$RELEASE_BUILD_NUMBER" --dart-define-from-file "$GITHUB_WORKSPACE/.env" --dart-define FLAVOR=prod
          cp build/app/outputs/flutter-apk/app-prod-release.apk "$GITHUB_WORKSPACE/dist/mapid-explorer-$RELEASE_TAG-android.apk"
          cp build/app/outputs/bundle/prodRelease/app-prod-release.aab "$GITHUB_WORKSPACE/dist/mapid-explorer-$RELEASE_TAG-android.aab"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$GITHUB_WORKSPACE/dist/mapid-explorer-$RELEASE_TAG-android.apk"
      - name: Build unsigned iOS application
        if: matrix.platform == 'ios'
        working-directory: apps/fluent_starter
        run: |
          flutter build ios --release --flavor prod --no-codesign --build-name "$RELEASE_VERSION" --build-number "$RELEASE_BUILD_NUMBER" --dart-define-from-file "$GITHUB_WORKSPACE/.env" --dart-define FLAVOR=prod
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app "$GITHUB_WORKSPACE/dist/mapid-explorer-$RELEASE_TAG-ios-unsigned.app.zip"
      - name: Build Web
        if: matrix.platform == 'web'
        working-directory: apps/fluent_starter
        run: flutter build web --release --build-name "$RELEASE_VERSION" --build-number "$RELEASE_BUILD_NUMBER" --dart-define-from-file "$GITHUB_WORKSPACE/.env" --dart-define FLAVOR=prod
      - name: Package Web
        if: matrix.platform == 'web'
        working-directory: apps/fluent_starter/build/web
        run: zip -qr "$GITHUB_WORKSPACE/dist/mapid-explorer-$RELEASE_TAG-web.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Remove build credentials
        if: always()
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          for path in (
              Path('.env'),
              Path('apps/fluent_starter/android/key.properties'),
              Path(os.environ['RUNNER_TEMP']) / 'mapid-release.jks',
          ):
              path.unlink(missing_ok=True)
          PYTHON

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      RELEASE_PRERELEASE: ${{ needs.verify.outputs.prerelease }}
      RELEASE_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify artifacts and write release notes
        run: |
          python3 - <<'PYTHON'
          import hashlib, os
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          directory = Path('dist')
          names = [f'mapid-explorer-{tag}-{suffix}' for suffix in (
              'android.apk', 'android.aab', 'ios-unsigned.app.zip', 'web.zip',
          )]
          if set(path.name for path in directory.iterdir()) != set(names):
              raise SystemExit('The release must contain all four expected artifacts.')
          checksums = []
          for name in sorted(names):
              path = directory / name
              if not path.stat().st_size:
                  raise SystemExit(f'Empty release artifact: {name}')
              checksums.append(f'{hashlib.file_digest(path.open("rb"), "sha256").hexdigest()}  {name}\n')
          (directory / 'SHA256SUMS').write_text(''.join(checksums))
          notes = f'''MAPID Explorer {tag}

          | Artifact | Usage |
          | --- | --- |
          | Android APK | Install on an Android device. Signed with the persistent project release key. |
          | Android AAB | App bundle for a store submission; cannot be installed directly. |
          | iOS unsigned app ZIP | Device build without Apple signing. Requires signing and provisioning before installation; it is not a simulator app or an installable IPA. |
          | Web ZIP | Extract and serve from the root of an HTTPS static host. Desktop browsers use this build. |
          | SHA256SUMS | SHA-256 checksums of the four build artifacts. |

          The app includes the production MAPID layer configuration. Internet access is required.
          Browser location requires HTTPS (or localhost) and permission. Compass availability depends on the platform.

          Source: {os.environ['GITHUB_SHA']}
          Build: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}
          '''
          notes = '\n'.join(line.removeprefix('          ') for line in notes.splitlines()) + '\n'
          (Path(os.environ['RUNNER_TEMP']) / 'release-notes.md').write_text(notes)
          PYTHON
      - name: Create or update the draft, then publish when requested
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          notes = str(Path(os.environ['RUNNER_TEMP']) / 'release-notes.md')
          existing = subprocess.run(
              ['gh', 'release', 'view', tag, '--json', 'isDraft,targetCommitish'],
              capture_output=True, text=True,
          )
          if existing.returncode == 0:
              release = json.loads(existing.stdout)
              if not release['isDraft'] or release['targetCommitish'] != os.environ['GITHUB_SHA']:
                  raise SystemExit('Refusing to replace a published release or a draft for another commit.')
              subprocess.run(['gh', 'release', 'edit', tag, '--notes-file', notes], check=True)
          else:
              subprocess.run([
                  'gh', 'release', 'create', tag, '--draft',
                  '--target', os.environ['GITHUB_SHA'],
                  '--title', f'MAPID Explorer {tag}', '--notes-file', notes,
                  '--prerelease=' + os.environ['RELEASE_PRERELEASE'],
              ], check=True)
          subprocess.run([
              'gh', 'release', 'upload', tag, '--clobber',
              *[str(path) for path in sorted(Path('dist').iterdir())],
          ], check=True)
          if os.environ['RELEASE_PUBLISH'] == 'true':
              subprocess.run(['gh', 'release', 'edit', tag, '--draft=false'], check=True)
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a') as output:
              state = 'Published' if os.environ['RELEASE_PUBLISH'] == 'true' else 'Draft'
              output.write(f'{state} release: **{tag}**. All four artifacts and SHA256SUMS were uploaded.\n')
          PYTHON
